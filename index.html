<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pody</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const Download = () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
    );

    const Plus = () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
        </svg>
    );

    const Trash2 = () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
    );

    const RefreshCw = ({ className }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
    );

    const Settings = () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
    );

    const X = () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
        </svg>
    );

    const Check = () => (
        <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
        </svg>
    );

    const Loader2 = ({ className }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
        </svg>
    );

    const API_BASE = '/api';

    function PodcastManager() {
        const [podcasts, setPodcasts] = useState([]);
        const [config, setConfig] = useState({ downloadPath: 'downloads', updateIntervalHr: 5 });
        const [showAddModal, setShowAddModal] = useState(false);
        const [showSettingsModal, setShowSettingsModal] = useState(false);
        const [newPodcastUrl, setNewPodcastUrl] = useState('');
        const [downloadHistory, setDownloadHistory] = useState(false);
        const [loading, setLoading] = useState(false);

        useEffect(() => {
            fetchPodcasts();
            fetchConfig();
            const interval = setInterval(fetchPodcasts, 5000);
            return () => clearInterval(interval);
        }, []);

        const fetchPodcasts = async () => {
            try {
                const res = await fetch(`${API_BASE}/podcasts`);
                const data = await res.json();
                setPodcasts(data || []);
            } catch (err) {
                console.error('Error loading podcasts:', err);
            }
        };

        const fetchConfig = async () => {
            try {
                const res = await fetch(`${API_BASE}/config`);
                const data = await res.json();
                setConfig(data);
            } catch (err) {
                console.error('Error loading config:', err);
            }
        };

        const addPodcast = async () => {
            if (!newPodcastUrl) return;
            setLoading(true);
            if (!newPodcastUrl.startsWith('https://www.youtube.com/playlist?list=')){
                alert('Please add a valid YouTube playlist URL');
                setLoading(false);
                return;
            }
            try {
                await fetch(`${API_BASE}/podcast/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: newPodcastUrl, downloadHistory })
                });
                setNewPodcastUrl('');
                setDownloadHistory(false);
                setShowAddModal(false);
                setTimeout(fetchPodcasts, 2000);
            } catch (err) {
                console.error('Error adding podcast:', err);
            }
            setLoading(false);
        };

        const deletePodcast = async (id) => {
            if (!confirm('Delete podcast?')) return;
            try {
                await fetch(`${API_BASE}/podcast/delete?id=${id}`, { method: 'DELETE' });
                fetchPodcasts();
            } catch (err) {
                console.error('Error deleting podcast:', err);
            }
        };

        const downloadEpisode = async (podcastId, episodeId) => {
            try {
                await fetch(`${API_BASE}/episode/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ podcastId, episodeId })
                });
                setTimeout(fetchPodcasts, 1000);
            } catch (err) {
                console.error('Error downloading episode:', err);
            }
        };

        const updateNow = async () => {
            setLoading(true);
            try {
                await fetch(`${API_BASE}/update-now`, { method: 'POST' });
                setTimeout(fetchPodcasts, 2000);
            } catch (err) {
                console.error('Error updating now:', err);
            }
            setLoading(false);
        };

        const saveConfig = async () => {
            try {
                await fetch(`${API_BASE}/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                setShowSettingsModal(false);
            } catch (err) {
                console.error('Error saving config:', err);
            }
        };

        return (
            <div className="min-h-screen bg-gradient-to-br from-purple-50 to-blue-50">
                <div className="container mx-auto px-4 py-8 max-w-7xl">
                    <div className="bg-white rounded-2xl shadow-lg p-6 mb-8">
                        <div className="flex items-center justify-between">
                            <div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">Pody</h1>
                                <p className="text-gray-600">Managing {podcasts.length} Podcasts</p>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={updateNow} disabled={loading} className="flex items-center gap-2 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition disabled:opacity-50">
                                    <RefreshCw className={`w-5 h-5 ${loading ? 'animate-spin' : ''}`} />
                                    Update
                                </button>
                                <button onClick={() => setShowSettingsModal(true)} className="flex items-center gap-2 px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition">
                                    <Settings />
                                    Settings
                                </button>
                                <button onClick={() => setShowAddModal(true)} className="flex items-center gap-2 px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition">
                                    <Plus />
                                    Add Podcast
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {podcasts.map((podcast) => (
                            <div key={podcast.id} className="bg-white rounded-2xl shadow-lg overflow-hidden">
                                <div className="p-6 border-b border-gray-200">
                                    <div className="flex items-start justify-between mb-4">
                                        <div className="flex-1">
                                            <h2 className="text-xl font-bold text-gray-800 mb-2">{podcast.title}</h2>
                                            <p className="text-sm text-gray-600">{podcast.description}</p>
                                        </div>
                                        {podcast.thumbnails?.[0] && (
                                            <img src={podcast.thumbnails[0].url} alt={podcast.title} className="w-20 h-20 rounded-lg object-cover ml-4" />
                                        )}
                                    </div>
                                    <div className="flex items-center justify-between">
                                        <span className="text-sm text-gray-500">{podcast.entries?.length || 0} Episodes</span>
                                        <button onClick={() => deletePodcast(podcast.id)} className="p-2 text-red-500 hover:bg-red-50 rounded-lg transition">
                                            <Trash2 />
                                        </button>
                                    </div>
                                </div>

                                <div className="max-h-96 overflow-y-auto">
                                    {podcast.entries?.map((episode) => (
                                        <div key={episode.id} className="p-4 border-b border-gray-100 hover:bg-gray-50 transition">
                                            <div className="flex items-center justify-between">
                                                <div className="flex-1 min-w-0">
                                                    <h3 className="text-sm font-medium text-gray-800 truncate mb-1">{episode.title}</h3>
                                                    <div className="flex items-center gap-3 text-xs text-gray-500">
                                                        {episode.duration && <span>{Math.floor(episode.duration / 60)} min</span>}
                                                        {episode.downloadingState?.downloaded && (
                                                            <span className="flex items-center gap-1 text-green-600">
                                                                    <Check />
                                                                    Downloaded
                                                                </span>
                                                        )}
                                                        {episode.downloadingState?.isDownloading && (
                                                            <span className="flex items-center gap-1 text-blue-600">
                                                                    <Loader2 className="w-3 h-3 animate-spin" />
                                                                    Downloading...
                                                                </span>
                                                        )}
                                                    </div>
                                                </div>
                                                {!episode.downloadingState?.downloaded && !episode.downloadingState?.isDownloading && (
                                                    <button onClick={() => downloadEpisode(podcast.id, episode.id)} className="p-2 text-purple-500 hover:bg-purple-50 rounded-lg transition ml-2">
                                                        <Download />
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    {podcasts.length === 0 && (
                        <div className="text-center py-20">
                            <p className="text-gray-500 text-lg mb-4">No podcasts available</p>
                            <button onClick={() => setShowAddModal(true)} className="inline-flex items-center gap-2 px-6 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition">
                                <Plus />
                                Add first podcast
                            </button>
                        </div>
                    )}

                    {showAddModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
                                <div className="flex items-center justify-between mb-6">
                                    <h3 className="text-xl font-bold text-gray-800">Add Podcast</h3>
                                    <button onClick={() => setShowAddModal(false)} className="p-2 hover:bg-gray-100 rounded-lg transition">
                                        <X />
                                    </button>
                                </div>
                                <input type="text" value={newPodcastUrl} onChange={(e) => setNewPodcastUrl(e.target.value)} placeholder="YouTube/Podcast URL" className="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                <label className="flex items-center gap-2 mb-6 cursor-pointer">
                                    <input type="checkbox" checked={downloadHistory} onChange={(e) => setDownloadHistory(e.target.checked)} className="w-4 h-4 text-purple-500 rounded focus:ring-purple-500" />
                                    <span className="text-sm text-gray-700">Download all existing episodes</span>
                                </label>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowAddModal(false)} className="flex-1 px-4 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition">Cancel</button>
                                    <button onClick={addPodcast} disabled={loading || !newPodcastUrl} className="flex-1 px-4 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition disabled:opacity-50">
                                        {loading ? 'Adding...' : 'Add'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showSettingsModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
                                <div className="flex items-center justify-between mb-6">
                                    <h3 className="text-xl font-bold text-gray-800">Settings</h3>
                                    <button onClick={() => setShowSettingsModal(false)} className="p-2 hover:bg-gray-100 rounded-lg transition">
                                        <X />
                                    </button>
                                </div>
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Download Path</label>
                                        <input type="text" value={config.downloadPath} onChange={(e) => setConfig({ ...config, downloadPath: e.target.value })} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Update Interval (hours)</label>
                                        <input type="number" value={config.updateIntervalHr} onChange={(e) => setConfig({ ...config, updateIntervalHr: parseInt(e.target.value) })} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowSettingsModal(false)} className="flex-1 px-4 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition">Cancel</button>
                                    <button onClick={saveConfig} className="flex-1 px-4 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition">Save</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    ReactDOM.render(<PodcastManager />, document.getElementById('root'));
</script>
</body>
</html>
